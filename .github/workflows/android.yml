name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python for Omepikya LLM
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install LLM prototype dependencies
        run: python -m pip install -r llm/requirements.txt

      - name: Test Omepikya Tiny
        working-directory: llm
        run: python -m unittest discover -s tests -v

      - name: Train LLM smoke-test checkpoint
        working-directory: llm
        run: python train.py --text data/sample.txt --steps 25 --log-every 25 --output /tmp/omepikya_tiny.npz

      - name: Verify LLM generation
        working-directory: llm
        run: python generate.py --checkpoint /tmp/omepikya_tiny.npz --prompt "O" --tokens 20

      - name: Verify LLM evaluation
        working-directory: llm
        run: python evaluate.py --checkpoint /tmp/omepikya_tiny.npz --text data/sample.txt

      - name: Set up JDK 11
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '11'

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Unit tests
        run: ./gradlew test --no-daemon

      - name: Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: omepikya-command-center-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: omepikya-command-center-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
