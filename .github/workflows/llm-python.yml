name: Omepikya LLM Python CI

on:
  push:
    branches:
      - feature/omepikya-tiny-llm-clean
    paths:
      - "llm/**"
      - ".github/workflows/llm-python.yml"
  pull_request:
    branches:
      - main
    paths:
      - "llm/**"
      - ".github/workflows/llm-python.yml"
  workflow_dispatch:

jobs:
  tiny-language-model:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r llm/requirements.txt
      - name: Run unit tests
        working-directory: llm
        run: python -m unittest discover -s tests -v
      - name: Train causal Transformer smoke-test checkpoint
        working-directory: llm
        run: python train_transformer.py --text data/sample.txt --steps 5 --batch-size 4 --block-size 8 --embedding-dim 8 --heads 2 --output /tmp/omepikya_transformer.pt
      - name: Verify causal Transformer generation
        working-directory: llm
        run: python generate_transformer.py --checkpoint /tmp/omepikya_transformer.pt --prompt "O" --tokens 5
      - name: Run context-model unit tests
        working-directory: llm
        run: python -m unittest tests/test_omepikya_context.py -v
      - name: Train a context-model smoke-test checkpoint
        working-directory: llm
        run: python train_context.py --text data/sample.txt --steps 5 --log-every 5 --output /tmp/omepikya_context.npz
      - name: Verify context-model generation
        working-directory: llm
        run: python generate_context.py --checkpoint /tmp/omepikya_context.npz --prompt "O" --tokens 10
      - name: Compare model baselines on held-out text
        working-directory: llm
        run: python benchmark.py --text data/sample.txt --steps 5 --transformer-steps 5 --block-size 8 --embedding-dim 8 --heads 2 --batch-size 4
      - name: Train a smoke-test checkpoint
        working-directory: llm
        run: python train.py --text data/sample.txt --steps 25 --log-every 25 --output /tmp/omepikya_tiny.npz
      - name: Verify checkpoint generation
        working-directory: llm
        run: python generate.py --checkpoint /tmp/omepikya_tiny.npz --prompt "O" --tokens 20
      - name: Verify evaluation
        working-directory: llm
        run: python evaluate.py --checkpoint /tmp/omepikya_tiny.npz --text data/sample.txt
