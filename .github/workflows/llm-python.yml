name: Omepikya LLM Python CI

on:
  push:
    branches:
      - feature/omepikya-tiny-llm
    paths:
      - "llm/**"
      - ".github/workflows/llm-python.yml"
  pull_request:
    branches:
      - main
    paths:
      - "llm/**"
      - ".github/workflows/llm-python.yml"
  workflow_dispatch:

jobs:
  tiny-language-model:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r llm/requirements.txt
      - name: Run unit tests
        working-directory: llm
        run: python -m unittest discover -s tests -v
      - name: Train a smoke-test checkpoint
        working-directory: llm
        run: python train.py --text data/sample.txt --steps 25 --log-every 25 --output /tmp/omepikya_tiny.npz
      - name: Verify checkpoint generation
        working-directory: llm
        run: python generate.py --checkpoint /tmp/omepikya_tiny.npz --prompt "O" --tokens 20
      - name: Verify evaluation
        working-directory: llm
        run: python evaluate.py --checkpoint /tmp/omepikya_tiny.npz --text data/sample.txt
