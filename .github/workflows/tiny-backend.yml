name: Tiny Backend CI

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'server/**'
      - '.github/workflows/tiny-backend.yml'
  push:
    branches: [ main ]
    paths:
      - 'server/**'
      - '.github/workflows/tiny-backend.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run backend tests
        working-directory: server
        run: npm test
