name: Omepikya Web CI

on:
  push:
    branches: [ main ]
    paths:
      - 'web/**'
      - '.github/workflows/web.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'web/**'
      - '.github/workflows/web.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check JavaScript syntax
        run: |
          node --check web/app.js
          node --check web/sw.js

      - name: Validate PWA manifest and icon
        run: |
          node -e "const fs=require('fs'); const m=JSON.parse(fs.readFileSync('web/manifest.webmanifest','utf8')); if (!Array.isArray(m.icons) || !m.icons.some(i => i.src === './icon.svg')) process.exit(1);"
          test -s web/icon.svg

      - name: Verify required web files
        run: |
          test -s web/index.html
          test -s web/styles.css
          test -s web/app.js
          test -s web/sw.js
          test -s web/manifest.webmanifest
          test -s web/README.md

      - name: Check patch whitespace
        run: git diff --check
