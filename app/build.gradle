apply plugin: 'com.android.application'

// This key is for repeatable DEBUG installs only. Never reuse it for a public
// production release. Keeping the debug certificate stable prevents Android
// signature conflicts when installing newer CI debug APKs over older ones.
def stableDebugKeyFile = file("$buildDir/omepikya-debug.keystore")
def stableDebugKeyEncoded = file("omepikya-debug.keystore.b64")
if (stableDebugKeyEncoded.exists()) {
    stableDebugKeyFile.parentFile.mkdirs()
    stableDebugKeyFile.bytes = java.util.Base64.decoder.decode(
            stableDebugKeyEncoded.text.trim()
    )
}

android {
    namespace 'com.omepikya.commandcenter'
    compileSdkVersion 34

    defaultConfig {
        applicationId "com.omepikya.commandcenter"
        minSdkVersion 23
        targetSdkVersion 34
        versionCode 2
        versionName "2.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        stableDebug {
            storeFile stableDebugKeyFile
            storePassword "omepikya-debug-only"
            keyAlias "omepikya-debug"
            keyPassword "omepikya-debug-only"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.stableDebug
            minifyEnabled false
        }
        release {
            // Release signing must use a separate private production keystore.
            // Do not sign production releases with the public debug key.
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:4.11.0'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
