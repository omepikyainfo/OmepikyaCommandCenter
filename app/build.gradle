apply plugin: 'com.android.application'

// Optional repeatable DEBUG signing is supplied only through GitHub Actions
// secrets. If no complete secret set is configured, use Gradle's standard
// debug signing. Never use a debug key for a production release.
def stableDebugKeyFile = file("$buildDir/omepikya-debug.keystore")
def stableDebugKeyEncoded = System.getenv("OMEPIKYA_DEBUG_KEYSTORE_B64")
def stableDebugStorePassword = System.getenv("OMEPIKYA_DEBUG_STORE_PASSWORD")
def stableDebugKeyAlias = System.getenv("OMEPIKYA_DEBUG_KEY_ALIAS")
def stableDebugKeyPassword = System.getenv("OMEPIKYA_DEBUG_KEY_PASSWORD")
def hasStableDebugSigning = [stableDebugKeyEncoded, stableDebugStorePassword,
        stableDebugKeyAlias, stableDebugKeyPassword].every { it != null && !it.trim().isEmpty() }

if (hasStableDebugSigning) {
    stableDebugKeyFile.parentFile.mkdirs()
    stableDebugKeyFile.bytes = java.util.Base64.decoder.decode(stableDebugKeyEncoded.trim())
}

android {
    namespace 'com.omepikya.commandcenter'
    compileSdkVersion 34

    defaultConfig {
        applicationId "com.omepikya.commandcenter"
        minSdkVersion 23
        targetSdkVersion 34
        versionCode 2
        versionName "2.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        if (hasStableDebugSigning) {
            stableDebug {
                storeFile stableDebugKeyFile
                storePassword stableDebugStorePassword
                keyAlias stableDebugKeyAlias
                keyPassword stableDebugKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            if (hasStableDebugSigning) {
                signingConfig signingConfigs.stableDebug
            }
            minifyEnabled false
        }
        release {
            // Release signing must use a separate private production keystore.
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:4.11.0'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
